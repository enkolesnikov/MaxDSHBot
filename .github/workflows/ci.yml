name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-max-notify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check (all modules)
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Package dry-run
        run: npm pack --dry-run
